<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="zad4.css">
    <script src="zad4.js" type="module"></script>

    <title>Krzysztof Nawrot</title>
  </head>
  <body class="welcome-page">
    <div class="main-container">
      <div class="calculator">
        <div class="displayer">
          <div id="displayer" class="text">
            0
          </div>
        </div>
        <div class="button-groups-container">
          <div class="number-button-row">
            <div class="empty">

            </div>
            <button id="reset-button" class="reset-button">
              AC
            </button>
          </div>
          <div class="number-button-row">
            <button class="number-button">
              7
            </button>
            <button class="number-button">
              8
            </button>
            <button class="number-button">
              9
            </button>
            <button class="operation-button">
              ×
            </button>
          </div>
          <div class="number-button-row">
            <button class="number-button">
              4
            </button>
            <button class="number-button">
              5
            </button>
            <button class="number-button">
              6
            </button>
            <button class="operation-button">
              ÷
            </button>
          </div>
          <div class="number-button-row">
            <button class="number-button">
              1
            </button>
            <button class="number-button">
              2
            </button>
            <button class="number-button">
              3
            </button>
            <button class="operation-button">
              -
            </button>
          </div>
          <div class="number-button-row">
            <button class="number-button">
              0
            </button>
            <button class="number-button">
              .
            </button>
            <button  id="equals-button" class="equals-button">
              =
            </button>
            <button class="operation-button">
              +
            </button>
          </div>
      </div>
    </div>
   
  </body>
</html>
